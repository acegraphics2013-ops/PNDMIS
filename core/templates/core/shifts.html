{% extends 'core/base.html' %}{% block content %}<div class="card"><h3>Unit staffing counts</h3><p><a class="btn sm" href="{% url 'add_shift' %}">Enter shift count</a></p><div class="twrap"><table><tr><th>Unit</th><th>Date</th><th>Shift</th><th>On duty</th></tr>{% for s in shifts %}<tr><td>{{ s.unit }}</td><td>{{ s.date }}</td><td>{{ s.shift }}</td><td>{{ s.on_duty }}</td></tr>{% empty %}<tr><td colspan="4"><div class="empty"><h3>No records</h3><p>Enter shift counts per unit.</p></div></td></tr>{% endfor %}</table></div></div>{% endblock %}

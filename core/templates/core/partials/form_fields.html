{% if form.non_field_errors %}
<div class="nonfield" role="alert">
  {% for error in form.non_field_errors %}<div>{{ error }}</div>{% endfor %}
</div>
{% endif %}
<div class="form-grid">
  {% for field in form %}
  <div class="field{% if field.errors %} has-error{% endif %}{% if field.field.widget.input_type == 'checkbox' %} field-check{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="req" aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<div class="hint">{{ field.help_text }}</div>{% endif %}
    {% for error in field.errors %}<div class="ferr">{{ error }}</div>{% endfor %}
  </div>
  {% endfor %}
</div>
